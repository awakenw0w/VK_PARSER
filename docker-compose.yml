services:
  bot:
    build: .
    restart: unless-stopped
    env_file: .env
    volumes:
      - bot_data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import sqlite3; sqlite3.connect('/app/data/bot.db').execute('select 1')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  bot_data:
