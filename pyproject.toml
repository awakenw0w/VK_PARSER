[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "vk-chat-finder-bot"
version = "0.1.0"
description = "Telegram bot that finds VK communities and public chat invitation links"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "aiogram==3.30.0",
  "SQLAlchemy==2.0.51",
  "aiosqlite==0.22.1",
  "alembic==1.18.5",
  "httpx==0.28.1",
  "pydantic-settings==2.14.2",
]

[project.optional-dependencies]
dev = [
  "pytest==9.0.2",
  "pytest-asyncio==1.3.0",
  "respx==0.22.0",
  "ruff==0.15.6",
]

[project.scripts]
vk-chat-bot = "vk_chat_bot.app:run"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
vk_chat_bot = ["data/*.json"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
ignore = ["E501"]
